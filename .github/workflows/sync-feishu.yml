name: Sync docs to Feishu

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "scripts/sync_feishu.py"
      - "feishu-mapping.json"
      - ".github/workflows/sync-feishu.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Markdown to Feishu wiki
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_SPACE_ID: ${{ secrets.FEISHU_SPACE_ID }}
          FEISHU_PARENT_NODE_TOKEN: ${{ secrets.FEISHU_PARENT_NODE_TOKEN }}
          FEISHU_REFRESH_TOKEN: ${{ secrets.FEISHU_REFRESH_TOKEN }}
        run: python3 scripts/sync_feishu.py

      - name: Commit mapping if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feishu-mapping.json
          if git diff --staged --quiet; then
            echo "mapping unchanged"
          else
            git commit -m "chore: update Feishu wiki mapping"
            git push
          fi
